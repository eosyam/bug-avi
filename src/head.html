<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bug Avı</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PVYWF3KK5T"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-PVYWF3KK5T');

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --panel:rgba(12,18,33,.88); --panel2:rgba(20,29,52,.9); --line:rgba(120,160,255,.16);
  --text:#e8eefc; --muted:#8b98b8; --cyan:#36e2ff; --mag:#ff3d81; --yel:#ffd23f; --grn:#3ddc97; --red:#ff4d6d;
  --head:'Chakra Petch',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--head);overflow:hidden;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
body.playing #game canvas{cursor:none}
button{font-family:var(--head);cursor:pointer}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#crosshair{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%)}
#crosshair i{position:absolute;background:var(--xh,#fff);box-shadow:0 0 4px rgba(0,0,0,.8)}
#crosshair i:nth-child(1){left:13px;top:0;width:2px;height:8px}
#crosshair i:nth-child(2){left:13px;bottom:0;width:2px;height:8px}
#crosshair i:nth-child(3){top:13px;left:0;height:2px;width:8px}
#crosshair i:nth-child(4){top:13px;right:0;height:2px;width:8px}
#crosshair b{position:absolute;left:12px;top:12px;width:4px;height:4px;border-radius:50%;background:var(--xh,#fff)}
#hitmark{position:absolute;left:50%;top:50%;width:36px;height:36px;transform:translate(-50%,-50%) rotate(45deg);opacity:0;transition:opacity .12s}
#hitmark i{position:absolute;background:#fff}
#hitmark i:nth-child(1){left:17px;top:0;width:2px;height:10px}
#hitmark i:nth-child(2){left:17px;bottom:0;width:2px;height:10px}
#hitmark i:nth-child(3){top:17px;left:0;height:2px;width:10px}
#hitmark i:nth-child(4){top:17px;right:0;height:2px;width:10px}
#hitmark.on{opacity:1;transition:none}
#hitmark.kill i{background:var(--red)}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(255,30,60,.0);transition:box-shadow .25s}
#lowhp{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,0,40,.28));opacity:0;transition:opacity .4s}
#dmgdir{position:absolute;left:50%;top:50%;width:0;height:0}
.dmgarc{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border:5px solid transparent;border-top-color:rgba(255,60,80,.9);filter:drop-shadow(0 0 6px rgba(255,0,40,.8));animation:fadeArc .9s forwards}
@keyframes fadeArc{from{opacity:1}to{opacity:0}}
.hudbox{position:absolute;background:linear-gradient(180deg,rgba(10,16,30,.72),rgba(10,16,30,.5));border:1px solid var(--line);border-radius:10px;padding:10px 14px;backdrop-filter:blur(4px)}
#hpbox{left:22px;bottom:22px;width:300px}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--muted)}
#hpbar{height:12px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-top:6px}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#3ddc97,#36e2ff);transition:width .15s}
#hpnum{font-family:var(--mono);font-weight:800;font-size:26px;line-height:1}
#abil{display:flex;gap:8px;margin-top:10px}
.ab{position:relative;width:46px;height:46px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.ab .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0)}
.ab .k{position:absolute;right:3px;bottom:1px;font-family:var(--mono);font-size:9px;color:var(--muted)}
.ab.ready{border-color:rgba(54,226,255,.55);box-shadow:0 0 10px rgba(54,226,255,.25) inset}
#ammobox{right:22px;bottom:22px;text-align:right;min-width:220px}
#ammo{font-family:var(--mono);font-weight:800;font-size:40px;line-height:1}
#ammo small{font-size:18px;color:var(--muted)}
#wname{font-size:15px;color:var(--cyan);margin-top:4px}
#wslots{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.ws{font-family:var(--mono);font-size:11px;width:26px;height:22px;border-radius:5px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ws.on{border-color:var(--cyan);color:var(--cyan);background:rgba(54,226,255,.12)}
.ws.lock{opacity:.3}
#topbar{left:50%;top:16px;transform:translateX(-50%);display:flex;gap:22px;align-items:center;padding:8px 20px}
.stat{text-align:center}
.stat .v{font-family:var(--mono);font-weight:800;font-size:24px;line-height:1.1}
#combo{color:var(--yel)}
#bossbar{position:absolute;left:50%;top:86px;transform:translateX(-50%);width:min(560px,70vw);text-align:center}
#bossbar .bn{font-weight:700;letter-spacing:.2em;color:var(--red);font-size:14px;text-shadow:0 0 10px rgba(255,0,40,.6)}
#bossbar .bb{height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-top:5px;border:1px solid rgba(255,77,109,.4)}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff2a2a,#ff8c42)}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .3s}
#banner.on{opacity:1}
#banner .t{font-size:46px;font-weight:700;letter-spacing:.08em;text-shadow:0 0 24px rgba(54,226,255,.6)}
#banner .s{font-size:16px;color:var(--muted);margin-top:4px;letter-spacing:.12em}
#popups{position:absolute;left:50%;top:50%}
.pop{position:absolute;left:24px;top:-8px;font-family:var(--mono);font-weight:800;font-size:15px;color:var(--yel);white-space:nowrap;animation:popup .8s forwards;text-shadow:0 1px 3px #000}
@keyframes popup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
#feed{position:absolute;right:20px;top:18px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.fe{background:rgba(10,16,30,.75);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;animation:fadeFeed 5s forwards}
.fe b{color:var(--cyan)} .fe em{color:var(--mag);font-style:normal}
@keyframes fadeFeed{0%,80%{opacity:1}100%{opacity:0}}
#toasts{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel2);border:1px solid rgba(54,226,255,.35);border-radius:10px;padding:10px 18px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:toastIn 3.2s forwards}
.toast b{color:var(--yel)}
@keyframes toastIn{0%{opacity:0;transform:translateY(-10px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
#scoreboard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,90vw);padding:16px 20px}
#scoreboard table{width:100%;border-collapse:collapse;font-size:15px}
#scoreboard td,#scoreboard th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
#scoreboard th{font-size:11px;letter-spacing:.14em;color:var(--muted)}
#scoreboard td.n{font-family:var(--mono)}
#respawn{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;padding:18px 30px}
#respawn .t{font-size:28px;font-weight:700;color:var(--red)}
#netnote{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font-size:13px;color:var(--muted);padding:6px 14px}

/* ---------- Overlays / menu ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(7,11,20,.35),rgba(7,11,20,.88))}
#menu{align-items:stretch;justify-content:center;padding:24px;overflow:auto}
.shell{width:min(1180px,100%);display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:14px}
.logo .mk{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#ff3d81,#36e2ff);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 30px rgba(54,226,255,.35)}
.logo h1{margin:0;font-size:34px;letter-spacing:.06em;line-height:1}
.logo p{margin:4px 0 0;color:var(--muted);font-size:14px}
.pcard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:330px}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#071018}
.pc-mid{flex:1}
.pc-name{font-weight:700;font-size:16px}
.pc-title{font-size:12px;color:var(--cyan);letter-spacing:.06em}
.xpbar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff3d81,#36e2ff);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.pc-sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
.lvl{font-family:var(--mono);font-weight:800;font-size:24px;text-align:center;line-height:1}
.lvl small{display:block;font-size:9px;color:var(--muted);letter-spacing:.14em;font-family:var(--head)}
.coffee{font-family:var(--mono);font-weight:800;color:var(--yel);font-size:18px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 18px;border-radius:9px;font-size:14px;font-weight:600;letter-spacing:.08em}
.tab.on{color:#071018;background:var(--cyan);border-color:var(--cyan)}
.tab:hover:not(.on){color:var(--text);border-color:rgba(54,226,255,.5)}
.body{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
@media(max-width:900px){.body{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{margin:0 0 12px;font-size:13px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.modes{grid-template-columns:1fr}}
.mode{position:relative;text-align:left;background:linear-gradient(160deg,rgba(54,226,255,.10),rgba(255,61,129,.06));border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--text);min-height:170px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.mode:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan)}
.mode:disabled{opacity:.45;cursor:not-allowed}
.mode .ic{font-size:30px}
.mode .nm{font-size:21px;font-weight:700}
.mode .ds{font-size:13px;color:var(--muted);line-height:1.4;flex:1}
.mode .bs{font-family:var(--mono);font-size:12px;color:var(--yel)}
.mode.pvp{background:linear-gradient(160deg,rgba(255,61,129,.16),rgba(255,140,66,.06))}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;color:var(--red)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 16px;font-size:13px;color:var(--muted);margin-top:14px}
kbd{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text);margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.lock{opacity:.5}
.card .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .n{font-weight:700;font-size:16px}
.card .d{font-size:12.5px;color:var(--muted);line-height:1.4}
.card .s{font-family:var(--mono);font-size:11px;color:var(--cyan)}
.pill{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--grn);border-color:rgba(61,220,151,.4)}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:6px;border-radius:2px;background:rgba(255,255,255,.08)}
.pips i.on{background:var(--cyan)}
.btn{background:var(--cyan);color:#071018;border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px;letter-spacing:.04em}
.btn:disabled{background:rgba(255,255,255,.1);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.big{padding:13px 26px;font-size:16px}
.tints{display:flex;gap:10px;flex-wrap:wrap}
.tint{width:64px;text-align:center;font-size:10.5px;color:var(--muted);background:none;border:0;padding:0}
.tint .sw{width:46px;height:46px;border-radius:12px;margin:0 auto 4px;border:2px solid transparent}
.tint.on .sw{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.tint:disabled{opacity:.35;cursor:not-allowed}
.road{display:flex;flex-wrap:wrap;gap:6px}
.road span{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.road span.on{color:var(--text);border-color:var(--cyan)}
.road span.cur{background:var(--cyan);color:#071018;border-color:var(--cyan);font-weight:700}
.online{display:flex;flex-direction:column;gap:8px}
.op{display:flex;align-items:center;gap:10px;font-size:13.5px}
.op .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#071018;font-size:13px;flex:none}
.op .st{font-size:11.5px;color:var(--muted)}
.lbtabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.lbtabs button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:6px 12px;font-size:12.5px}
.lbtabs button.on{color:var(--text);border-color:var(--cyan);background:rgba(54,226,255,.1)}
table.lb{width:100%;border-collapse:collapse}
table.lb td,table.lb th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
table.lb th{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
table.lb td.r{font-family:var(--mono);font-weight:800;width:44px}
table.lb td.v{font-family:var(--mono);font-weight:800;text-align:right}
table.lb tr.me td{background:rgba(54,226,255,.08)}
table.lb .ttl{font-size:11px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.set{display:grid;grid-template-columns:160px 1fr 60px;gap:12px;align-items:center;margin-bottom:14px;font-size:14px}
.set input[type=range]{width:100%;accent-color:var(--cyan)}
.set input[type=text]{grid-column:2 / 4;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;font-family:var(--head);font-size:14px;user-select:text}
.set output{font-family:var(--mono);font-size:13px;color:var(--cyan)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--muted)}
.badge b{display:block;color:var(--text);font-size:13.5px;margin-bottom:2px}
.badge.on{border-color:rgba(255,210,63,.5);background:rgba(255,210,63,.06)}
.badge.on b::before{content:"★ ";color:var(--yel)}

.dialog{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 32px;width:min(560px,92vw);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.dialog h2{margin:0 0 6px;font-size:34px;letter-spacing:.05em}
.dialog .sub{color:var(--muted);margin-bottom:18px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.rg{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.rg .v{font-family:var(--mono);font-weight:800;font-size:24px}
.rg .l{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.lvup{font-size:22px;font-weight:700;color:var(--yel);text-shadow:0 0 18px rgba(255,210,63,.5);margin:6px 0;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.unl{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.unl div{background:rgba(61,220,151,.08);border:1px solid rgba(61,220,151,.35);border-radius:8px;padding:8px 12px;font-size:14px}
.unl div b{color:var(--grn)}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.newrec{color:var(--yel);font-weight:700;letter-spacing:.1em;font-size:13px}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div id="vignette"></div><div id="lowhp"></div>
  <div id="dmgdir"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hitmark"><i></i><i></i><i></i><i></i></div>
  <div id="popups"></div>
  <div id="topbar" class="hudbox">
    <div class="stat"><div class="lbl" id="lblA">SÜRE</div><div class="v" id="statA">3:00</div></div>
    <div class="stat"><div class="lbl">PUAN</div><div class="v" id="statScore">0</div></div>
    <div class="stat"><div class="lbl" id="lblC">COMBO</div><div class="v" id="combo">x1.0</div></div>
  </div>
  <div id="bossbar" class="hidden"><div class="bn">⚠ PROD INCIDENT ⚠</div><div class="bb"><div id="bossfill"></div></div></div>
  <div id="banner"><div class="t" id="bannerT"></div><div class="s" id="bannerS"></div></div>
  <div id="feed"></div>
  <div id="hpbox" class="hudbox">
    <div class="lbl">UPTIME</div>
    <div id="hpnum">100</div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="abil"></div>
  </div>
  <div id="ammobox" class="hudbox">
    <div id="ammo">12<small> / ∞</small></div>
    <div id="wname">console.log()</div>
    <div id="wslots"></div>
  </div>
  <div id="scoreboard" class="hudbox hidden"></div>
  <div id="respawn" class="hudbox hidden"><div class="t">BUILD FAILED</div><div id="respawnS"></div></div>
  <div id="netnote" class="hudbox hidden"></div>
</div>

<div id="toasts"></div>

<div id="menu" class="overlay">
  <div class="shell">
    <div class="top">
      <div class="logo"><div class="mk">🐞</div><div><h1>BUG AVI</h1><p>AI kodu yazarken sen bugları vur.</p></div></div>
      <div class="pcard" id="pcard"></div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="play">OYNA</button>
      <button class="tab" data-tab="arsenal">CEPHANELİK</button>
      <button class="tab" data-tab="shop">GELİŞTİRMELER</button>
      <button class="tab" data-tab="lb">LİDERLİK</button>
      <button class="tab" data-tab="settings">AYARLAR</button>
    </div>
    <div class="body">
      <div id="tabBody"></div>
      <div class="panel"><h3 id="onlineH">Çevrimiçi</h3><div class="online" id="online"></div></div>
    </div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="dialog">
    <h2>DURAKLATILDI</h2>
    <div class="sub" id="pauseSub">Breakpoint'e takıldın.</div>
    <div class="row">
      <button class="btn big" id="btnResume">Devam et</button>
