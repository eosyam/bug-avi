name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version: 22

      - name: Oyun sunucusunu Cloudflare'a yükle
        id: worker
        if: env.HAS_CF == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          npm ci --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "Sunucu adresi: ${url:-bulunamadı}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Siteyi hazırla
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html .nojekyll _site/
          if [ -n "${{ steps.worker.outputs.url }}" ]; then
            printf '{"server":"%s"}\n' "${{ steps.worker.outputs.url }}" > _site/config.json
          else
            echo '{}' > _site/config.json
          fi
          cat _site/config.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
