name = "bug-avi-server"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Oyunun açılabileceği adresler (virgülle ayır). Yerel test için: --var ALLOWED_ORIGINS:*
[vars]
ALLOWED_ORIGINS = "https://eosyam.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Board"]
